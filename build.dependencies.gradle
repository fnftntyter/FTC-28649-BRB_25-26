repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' } // FtcDashboard / Road Runner
    // Pedro Pathing의 tuning이 쓰는 dev.frozenmilk.sinister:Sloth가
    // Maven Central에 없다. 이 저장소를 빼면 Sloth를 못 받아서 sync가 깨진다.
    maven { url = 'https://repo.dairy.foundation/releases/' }
}

dependencies {
    // FTC SDK 12.0.0 — 2026-27 BIOBUZZ 시즌용 (2026-09-12 릴리스).
    // 버전을 올릴 때는 8개를 반드시 같은 버전으로 맞춘다.
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    //noinspection Aligned16KB
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.acmerobotics.dashboard:dashboard:0.5.0'
    implementation 'com.acmerobotics.roadrunner:core:0.5.5'

    // ── Pedro Pathing 3.0.2 (자율주행 경로 추종) ──
    // revhub가 core를 끌어온다. tuning은 튜닝용 OpMode + 웹 인터페이스.
    // 2.x의 'com.pedropathing:ftc'는 구 라인이라 쓰지 않는다.
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.3'
}

